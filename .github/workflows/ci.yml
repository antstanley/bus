name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Run typecheck
        run: bunx tsc --noEmit

  minio-s3:
    name: S3 conformance (floci)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLOCI_CONTAINER_NAME: board-ci-floci-${{ github.run_id }}-${{ github.run_attempt }}
      FLOCI_IMAGE: floci/floci@sha256:18eb2848c693b6c0bde2f43ae0266d18a40a300d8a4e29aa1eb665baaa958e77 # nightly-compat
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start floci S3 emulator
        id: floci
        shell: bash
        run: |
          set -euo pipefail

          docker run --detach \
            --name "$FLOCI_CONTAINER_NAME" \
            --publish 127.0.0.1::4566 \
            "$FLOCI_IMAGE"

          published="$(docker port "$FLOCI_CONTAINER_NAME" 4566/tcp)"
          port="${published##*:}"
          if [[ ! "$port" =~ ^[0-9]+$ ]]; then
            echo "Could not determine the published floci port" >&2
            exit 1
          fi

          ready=false
          for attempt in {1..30}; do
            if curl -s http://127.0.0.1:$port >/dev/null 2>&1; then
              ready=true
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$FLOCI_CONTAINER_NAME")" != "true" ]]; then
              echo "floci exited before becoming ready" >&2
              docker logs "$FLOCI_CONTAINER_NAME" >&2
              exit 1
            fi
            echo "Waiting for floci readiness ($attempt/30)"
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            echo "floci did not become ready within 60 seconds" >&2
            docker logs "$FLOCI_CONTAINER_NAME" >&2
            exit 1
          fi
          echo "endpoint=http://127.0.0.1:$port" >> "$GITHUB_OUTPUT"

      - name: Run real S3 conformance against floci
        env:
          BOARD_S3_INTEGRATION: "1"
          BOARD_S3_TEST_BUCKET: board-ci
          BOARD_S3_TEST_PREFIX: ci/floci/${{ github.run_id }}-${{ github.run_attempt }}
          S3_ENDPOINT: ${{ steps.floci.outputs.endpoint }}
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_REGION: us-east-1
        run: bun test packages/store-s3/test/s3-real.test.ts

      - name: Remove floci container
        if: always()
        shell: bash
        run: |
          if docker container inspect "$FLOCI_CONTAINER_NAME" >/dev/null 2>&1; then
            docker rm --force "$FLOCI_CONTAINER_NAME"
          fi

  live-aws-s3:
    name: S3 conformance (live AWS)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'antstanley/bus'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check live AWS S3 configuration
        id: aws-config
        env:
          BOARD_S3_TEST_BUCKET: ${{ secrets.BOARD_S3_TEST_BUCKET }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        shell: bash
        run: |
          missing=()
          for name in AWS_ROLE_ARN BOARD_S3_TEST_BUCKET AWS_REGION; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping live AWS S3 conformance; missing repository secrets: ${missing[*]}"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.aws-config.outputs.enabled == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        if: steps.aws-config.outputs.enabled == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        if: steps.aws-config.outputs.enabled == 'true'
        run: bun install --frozen-lockfile

      - name: Configure short-lived AWS credentials
        if: steps.aws-config.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run real S3 conformance against AWS
        if: steps.aws-config.outputs.enabled == 'true'
        env:
          BOARD_S3_INTEGRATION: "1"
          BOARD_S3_TEST_BUCKET: ${{ secrets.BOARD_S3_TEST_BUCKET }}
          BOARD_S3_TEST_PREFIX: ci/aws/${{ github.run_id }}-${{ github.run_attempt }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: bun test packages/store-s3/test/s3-real.test.ts
