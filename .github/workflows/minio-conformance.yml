# Dedicated S3 conformance for the store (floci emulator, task 406 + G4 R4).
#
# Runs packages/store-s3/test/minio-real.test.ts against the floci
# S3-compatible emulator (port 4566). floci auto-creates buckets on first
# PUT, so no explicit mc mb step is needed. Trigger strategy: pushes that
# touch the S3 store or this workflow, plus manual dispatch.

name: S3 conformance (floci)

on:
  push:
    paths:
      - "packages/store-s3/**"
      - "packages/core/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/minio-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minio-conformance:
    name: store-s3 conformance (floci)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLOCI_CONTAINER_NAME: board-floci-conf-${{ github.run_id }}-${{ github.run_attempt }}
      FLOCI_IMAGE: floci/floci@sha256:f8a61651d56c5bc2e09e8006ead2792a51629a20e6a # nightly-compat 2026-09-10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start floci S3 emulator
        id: floci
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name "$FLOCI_CONTAINER_NAME" \
            --publish 127.0.0.1::4566 \
            "$FLOCI_IMAGE"
          ready=false
          for attempt in {1..30}; do
            if curl -s http://127.0.0.1:$port >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "floci did not become ready" >&2
            docker logs "$FLOCI_CONTAINER_NAME" >&2
            exit 1
          fi

      - name: Run store-s3 conformance suite
        env:
          BOARD_MINIO_INTEGRATION: "1"
          BOARD_MINIO_TEST_BUCKET: board-floci-conf
          BOARD_MINIO_TEST_ENDPOINT: ${{ steps.floci.outputs.endpoint }}
          BOARD_MINIO_TEST_PREFIX: ci/floci/${{ github.run_id }}-${{ github.run_attempt }}
          BOARD_MINIO_TEST_REGION: us-east-1
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
        run: |
          set -o pipefail
          bun test packages/store-s3/test/minio-real.test.ts 2>&1 | tee minio-conformance.out
          if grep -qE '(^| )([1-9][0-9]*) skip( |$|\()' minio-conformance.out; then
            echo "::error::MinIO conformance suite skipped - gate drift must fail the job"
            exit 1
          fi
          grep -qE '(^| )([1-9][0-9]*) pass( |$)' minio-conformance.out || { echo "::error::no tests executed"; exit 1; }
          rm -f minio-conformance.out

      - name: Remove floci container
        if: always()
        shell: bash
        run: |
          if docker container inspect "$FLOCI_CONTAINER_NAME" >/dev/null 2>&1; then
            docker rm --force "$FLOCI_CONTAINER_NAME"
          fi
          docker exec "$MINIO_CONTAINER_NAME" \
            mc rm --recursive --force "board-minio/board-minio-conf/ci/minio/${{ github.run_id }}-${{ github.run_attempt }}" || true

      - name: Remove MinIO container
        if: always()
        shell: bash
        run: |
          if docker container inspect "$MINIO_CONTAINER_NAME" >/dev/null 2>&1; then
            docker rm --force --volumes "$MINIO_CONTAINER_NAME"
          fi
